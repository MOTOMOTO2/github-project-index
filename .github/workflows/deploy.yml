name: Build and deploy the project index

on:
  # Keep the index fresh without anyone touching it.
  schedule:
    - cron: '17 6 * * 1' # every Monday, 06:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Whether this repository can publish to Pages at all; see the Configure
      # Pages step below.
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the data layer
        run: python -m unittest discover -s tests -v

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        # Pages is not available on every repository: a private repository on a
        # free plan cannot publish one, and some org policies block the
        # Actions token from turning it on. That should not take the build down
        # with it, so the failure is recorded and the deploy job skips instead.
        continue-on-error: true
        with:
          # Turns Pages on for this repository on the first run, so nobody has
          # to flip the switch in Settings by hand.
          enablement: true

      - name: Say why the site will not be published
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning title=Pages unavailable::Pages could not be configured, so the site will be built but not published. Enable Pages (Settings -> Pages -> Source: GitHub Actions) — a private repository needs a paid plan, or make the repository public. The built site is attached to this run as the 'site' artifact."

      - name: Fetch the projects from the GitHub API
        env:
          # The default GITHUB_TOKEN is enough for public repositories. Add a
          # PROJECT_INDEX_TOKEN secret (a PAT) to raise the rate limit or, with
          # --include-private, to index private repositories too.
          GITHUB_TOKEN: ${{ secrets.PROJECT_INDEX_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_projects.py \
            --user "${{ github.repository_owner }}" \
            --output web/src/data/projects.json \
            --fallback-to-existing

      - uses: actions/setup-node@v4
        with:
          # Vite 8 / Vitest 5 / jsdom 30 all require >= 22.12.
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Test the page
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        env:
          # /<repo>/ for a project site, / for a user or custom-domain site.
          # Without Pages there is no base_path to read, so assume a project site.
          PAGES_BASE: ${{ steps.pages.outputs.base_path || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      # Downloadable from the run's summary page, whether or not Pages works.
      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: web/dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
